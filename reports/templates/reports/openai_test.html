{% extends "base.html" %}

{% block extrahead %}
    {% load static %}
    <link rel="stylesheet" href="{% static 'reports/style_e2.css' %}?v={{ STATIC_VERSION }}">
{% endblock %}

{% block nav %}
<nav class="navbar navbar-expand-sm bg-primary navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'reports:index' %}" >Patient suchen</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#collapsibleNavbar"
              aria-controls="collapsibleNavbar"
              aria-expanded="false"
              aria-label="Navigation umschalten">
          <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="collapsibleNavbar">
        <ul class="navbar-nav">
            <li class="nav-item">
              <a class="btn btn-primary btn-sm" href="{% url 'reports:index' %}" role="button">zurück</a>
            </li>
        </ul>
      </div>
    </div>
</nav>
{% endblock %}

{% block content %}
<content>
    <p></p>
    <div class="container">
           <div class="mb-3 row">
               <div class="col-sm-4">
                   <h4>Testbericht auf Basis OpenAI:</h4>
               </div>
           </div>
           <div class="mb-3 row">
               <div class="col-sm-12">
                 <p>{{bericht|linebreaksbr}}</p>
               </div>
           </div>
    </div>
</content>
{% endblock %}
